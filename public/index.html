<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orbit · AI Chat</title>
  <meta name="description" content="Orbit is a friendly, general-purpose AI chatbot powered by Groq.">
  <meta name="theme-color" content="#17181b">
  <link rel="icon" type="image/png" href="assets/robot.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#composer-input">Skip to message box</a>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Orbit</span>
        <span class="tag mono">AI&nbsp;CHAT</span>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="new-chat" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg>
          <span>New chat</span>
        </button>
        <button class="btn btn-icon" id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to light theme" title="Switch to light theme">
          <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
          <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <main class="layout" id="main">
      <section class="scene" aria-label="Orbit, your assistant">
        <span class="scene-label scene-label-tl mono" aria-hidden="true">UNIT · ORBIT-01</span>
        <span class="scene-label scene-label-br mono" aria-hidden="true">GROQ · LINKED</span>
        <div class="hero">
          <div class="scene-stage">
            <div class="rings" aria-hidden="true"><span></span><span></span></div>
            <img class="robot" src="assets/robot.png" alt="Orbit, a friendly pixel-art robot, waving hello" width="460" height="639">
            <div class="shadow" aria-hidden="true"></div>
          </div>
          <div class="hero-side">
            <p class="speech"><span class="speech-name mono" aria-hidden="true">ORBIT&gt;</span>Hey, I’m Orbit. What’s on your mind?</p>
            <p class="status mono" aria-hidden="true"><span class="status-dot"></span><span id="status-text">ONLINE · READY</span></p>
          </div>
        </div>
      </section>

      <section class="chat" aria-label="Conversation">
        <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Messages" tabindex="0">
          <div class="empty" id="empty">
            <p class="eyebrow mono">// START HERE</p>
            <h1 class="empty-title">Ask anything. <span class="hl-lime">Write</span>, <span class="hl-blue">explain</span>, <span class="hl-coral">brainstorm</span>.</h1>
            <p class="empty-sub">Pick a prompt to get going, or type your own below.</p>
            <ul class="suggestions" aria-label="Suggested questions">
              <li><button type="button" class="chip chip-lime" data-prompt="Explain how vaccines train the immune system, in plain language."><span class="chip-tag mono">EXPLAIN</span><span>How do vaccines train the immune system?</span></button></li>
              <li><button type="button" class="chip chip-blue" data-prompt="Write a short, friendly email asking to move a meeting from Tuesday to Thursday."><span class="chip-tag mono">WRITE</span><span>Draft an email to reschedule a meeting</span></button></li>
              <li><button type="button" class="chip chip-coral" data-prompt="Brainstorm 10 catchy name ideas for a weekend coffee cart, with a one-line pitch for each."><span class="chip-tag mono">BRAINSTORM</span><span>10 names for a weekend coffee cart</span></button></li>
              <li><button type="button" class="chip chip-lime" data-prompt="Explain recursion with a simple example in Python, then quiz me with one question."><span class="chip-tag mono">LEARN</span><span>Teach me recursion with an example</span></button></li>
            </ul>
          </div>
        </div>

        <form class="composer" id="composer" novalidate>
          <div class="composer-box">
            <label for="composer-input" class="visually-hidden">Message Orbit</label>
            <textarea id="composer-input" rows="1" maxlength="4000" placeholder="Message Orbit…" aria-describedby="composer-hint" enterkeyhint="send"></textarea>
            <button type="submit" class="send" id="send" aria-label="Send message" title="Send message" disabled>
              <svg class="icon-send" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M4 12h13M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"/></svg>
              <svg class="icon-stop" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="6" width="12" height="12" fill="currentColor"/></svg>
            </button>
          </div>
          <div class="composer-meta mono">
            <span id="composer-hint">Enter to send · Shift+Enter for a new line · Esc to stop</span>
            <span id="char-count" class="char-count"></span>
          </div>
        </form>
      </section>
    </main>

    <div class="visually-hidden" id="announcer" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
